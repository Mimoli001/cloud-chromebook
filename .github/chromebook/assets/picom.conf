# picom configuration for the classic (openbox) desktop.
# xrender works on Xvfb without a GPU; the compositor gives real transparency
# for the shelf and soft shadows around windows.
backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.38;
shadow-offset-x = -8;
shadow-offset-y = -8;
fading = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
